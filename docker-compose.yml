services:
  zdzirki:
    build: .
    image: zdzirki:latest
    container_name: zdzirki
    restart: unless-stopped
    environment:
      # hasło do wgrywania/usuwania klipów — ustaw w pliku .env obok tego pliku
      UPLOAD_PASSWORD: ${UPLOAD_PASSWORD:-}
    volumes:
      # klipy i ich lista przeżywają rebuild/restart kontenera
      - zdzirki-data:/data
    # cloudflared (na hoście) kieruje tunel na http://localhost:10007.
    # Bind do 127.0.0.1 => port nieosiągalny z zewnątrz, ruch tylko przez Cloudflare.
    ports:
      - "127.0.0.1:10007:8000"

volumes:
  zdzirki-data:
